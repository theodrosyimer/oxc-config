name: NPM Package CI

on:
  push:
    branches: ["**"] # Universal coverage
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Package CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc" # >=24.14.1 per `engines` (Oxlint TS configs need Node >=22.18)
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm oxfmt --check

      # Lint + typecheck in one pass (replaces `tsc --noEmit`)
      - name: Lint package code
        run: pnpm oxlint --type-aware --type-check --max-warnings=0

      # The React Native plugin's rules against eslint-plugin-react-native's
      # own test cases.
      - name: Test the React Native plugin
        run: pnpm test
